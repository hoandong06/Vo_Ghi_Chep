<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phần 4</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2433;--mut:#667085;--pri:#3b5bdb;--prt:#fff;--ok:#2b8a3e;--okb:#e3f6e8;--no:#c92a2a;--nob:#fde8e8;--bd:#dfe3ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1b2030;--tx:#e8ebf3;--mut:#9aa3b5;--pri:#7c93ff;--prt:#101420;--ok:#69db7c;--okb:#18321f;--no:#ff8787;--nob:#3a1b1b;--bd:#2c3347}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1b2030;--tx:#e8ebf3;--mut:#9aa3b5;--pri:#7c93ff;--prt:#101420;--ok:#69db7c;--okb:#18321f;--no:#ff8787;--nob:#3a1b1b;--bd:#2c3347}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:4px 0 12px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
nav button{flex:1 1 140px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:10px 14px;border-radius:10px}
button:hover{border-color:var(--pri)}
nav button.on{background:var(--pri);color:var(--prt);border-color:var(--pri)}
button.primary{background:var(--pri);color:var(--prt);border-color:var(--pri);font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:12px}
.big{font-size:1.5rem;font-weight:700;margin:6px 0;text-align:center}
.sub,.mut{color:var(--mut);font-size:.9rem;text-align:center}
.scr{text-align:center;font-size:1.6rem;letter-spacing:.2em;font-weight:700;color:var(--pri);margin:6px 0}
input[type=text],input:not([type]){width:100%;font:inherit;font-size:1.1rem;padding:12px;border-radius:10px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);margin:10px 0}
input:focus{outline:none;border-color:var(--pri)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.fb{min-height:1.6em;text-align:center;font-weight:600}
.fb.ok{color:var(--ok)}.fb.no{color:var(--no)}
.opts{display:grid;gap:8px;margin:12px 0}
.opts button{text-align:left;padding:12px 14px}
.opts button.ok,.col button.ok{background:var(--okb);border-color:var(--ok);color:var(--ok)}
.opts button.no,.col button.no{background:var(--nob);border-color:var(--no);color:var(--no)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.col{display:grid;gap:8px;align-content:start}
.col button.sel{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri)}
.col button:disabled{opacity:.75}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;color:var(--mut);font-size:.9rem;flex-wrap:wrap}
.chip.on{border-color:var(--pri);color:var(--pri);font-weight:600}
table{width:100%;border-collapse:collapse}td{padding:6px 4px;border-bottom:1px solid var(--bd)}
details summary{cursor:pointer;font-weight:600}
.wide{overflow-x:auto}
</style>
</head>
<body>
<div class="wrap">
<h1>📚 Phần 4</h1>
<nav id="nav">
<button data-t="1">1. Nghe &amp; gõ từ</button>
<button data-t="2">2. Nối từ</button>
<button data-t="3">3. Trắc nghiệm</button>
<button data-t="4">4. Bài tập</button>
</nav>
<div id="app"></div>
<p class="mut">Mẹo: nhấn <b>Enter</b> để bấm nút chính. Trắc nghiệm: nhấn phím 1–4 để chọn đáp án.</p>
</div>
<script>
// DỮ LIỆU: đúng theo vở, không bổ sung nghĩa
const W=[
["price","giá cả"],
["growing","tăng"],
["semiconductor","bán dẫn"],
["toner","mực"],
["inventory","kho"],
["discount","giảm giá"],
["classic tasters","cổ điển"],
["reps","đại diện"],
["brightly","rực rỡ"],
["seminar","tọa đàm"],
["productive","hiệu quả"],
["foolproof","không sai"],
["competition","cạnh tranh"],
["consumed","tiêu thụ"],
["downstair","tầng dưới"],
["currently","hiện tại"],
["bulk","bán sỉ"],
["inspiration","nguồn cảm hứng"],
["door-to-door","tiếp thị"],
["brisk","đắt"],
["techniques","kĩ năng"],
["satisfaction","hài lòng"],
["quality","chất lượng"],
["dominance","thống trị"],
["attention","tập trung"],
["convince","thuyết phục"],
["explore","khám phá"],
["department","bộ phận"],
["sluggishly","chậm"],
["complaint","phàn nàn"],
["clown","chú hề"],
["merchandise","hàng hóa"],
["specialists","chuyên gia"]];
const $=s=>document.querySelector(s),app=$('#app');
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>s.toLowerCase().replace(/\s+/g,' ').trim();
let voice=null;const TTS='speechSynthesis' in window;
function pick(){const v=speechSynthesis.getVoices();voice=v.find(x=>/en[-_]US/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null}
if(TTS){pick();speechSynthesis.onvoiceschanged=pick}
function say(t){if(!TTS)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(voice)u.voice=voice;u.rate=.85;speechSynthesis.speak(u)}
function scr(e){return e.split(' ').map(w=>{let s=w;for(let k=0;k<10&&s===w;k++)s=sh(w.split('')).join('');return s}).join('  ').toUpperCase()}
let tab=1;
function setTab(t){tab=t;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',+b.dataset.t===t));[,t1,t2,t3,t4][t]()}
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b)setTab(+b.dataset.t)};
document.addEventListener('keydown',e=>{
 if(e.target.closest('nav'))return;
 if(e.key==='Enter'){const g=$('#go');if(g){e.preventDefault();g.click()}}
 else if(tab===3&&/^[1-4]$/.test(e.key)&&!e.target.matches('input')){const o=document.querySelectorAll('.opts button')[+e.key-1];if(o)o.click()}
});

/* ---------- Gõ từ (dùng cho Menu 1 và Menu 4) ---------- */
function typer(c){
 const q=sh(W).slice(0,c.n||24);let i=0,sc=0,ok=null,bad=[];
 const draw=()=>{
  if(i>=q.length){
   app.innerHTML=`<div class="card"><div class="big">Hoàn thành: ${sc}/${q.length}</div>${bad.length?`<p class="mut">Từ cần ôn lại:</p><div class="wide"><table>${bad.map(b=>`<tr><td><b>${b[0]}</b></td><td>${b[1]}</td></tr>`).join('')}</table></div>`:'<p class="sub">Không sai từ nào 🎉</p>'}<div class="row"><button class="primary" id="go">Làm lại (Enter)</button></div></div>`;
   $('#go').onclick=c.back;return}
  const [e,v]=q[i];const k=c.kind==='mix'?['listen','meaning','scramble'][i%3]:c.kind;
  let p='';
  if(k==='learn')p=`<div class="big">${v}</div><p class="sub">Nghe phát âm, xem nghĩa rồi gõ từ tiếng Anh</p>`;
  if(k==='listen')p=`<div class="big">🔊 Nghe và gõ lại từ</div>`;
  if(k==='meaning')p=`<div class="big">${v}</div><p class="sub">Gõ từ tiếng Anh tương ứng</p>`;
  if(k==='scramble')p=`<div class="big">${v}</div><div class="scr">${c.sc||(c.sc={}),c.sc[e]||(c.sc[e]=scr(e))}</div><p class="sub">Sắp xếp lại các chữ cái</p>`;
  const snd=(k==='learn'||k==='listen'||ok!==null);
  app.innerHTML=`<div class="card"><div class="top"><span>${c.title}</span><span>${i+1}/${q.length} · Đúng ${sc}</span></div>${p}
  ${snd?'<div class="row"><button id="snd">🔊 Phát âm</button></div>':''}
  <input id="in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Gõ từ tiếng Anh rồi nhấn Enter…" ${ok!==null?'disabled':''}>
  <div class="fb ${ok===null?'':ok?'ok':'no'}">${ok===null?'':ok?'✔ Chính xác!':`✘ Đáp án: ${e}`}</div>
  <div class="row"><button class="primary" id="go">${ok===null?'Kiểm tra (Enter)':'Tiếp (Enter)'}</button>${c.back?'<button id="bk">Thoát</button>':''}</div></div>`;
  const inp=$('#in');if(ok===null)inp.focus();
  if($('#snd'))$('#snd').onclick=()=>say(e);
  if($('#bk'))$('#bk').onclick=c.back;
  if(ok===null&&(k==='learn'||k==='listen'))say(e);
  $('#go').onclick=()=>{
   if(ok===null){const val=inp.value;if(!norm(val)){inp.focus();return}ok=norm(val)===norm(e);if(ok)sc++;else bad.push(q[i]);draw();say(e)}
   else{i++;ok=null;draw()}
  };
 };
 draw();
}

/* ---------- Menu 1 ---------- */
function t1(){
 const box=document.createElement('div');
 const start=()=>{app.innerHTML='';const d=document.createElement('div');app.appendChild(d);
  const orig=app;typer({kind:'learn',title:'Nghe & gõ từ',n:33,back:t1});
  const det=document.createElement('details');det.className='card';det.innerHTML=`<summary>Danh sách 33 từ (bấm 🔊 để nghe)</summary><div class="wide"><table>${W.map((w,i)=>`<tr><td>${i+1}</td><td><b>${w[0]}</b></td><td>${w[1]}</td><td><button data-s="${i}">🔊</button></td></tr>`).join('')}</table></div>`;
  det.onclick=e=>{const b=e.target.closest('button[data-s]');if(b)say(W[+b.dataset.s][0])};
  app.after(det);det.id='lst'};
 document.querySelectorAll('#lst').forEach(x=>x.remove());
 app.innerHTML=`<div class="card"><div class="big">Nghe phát âm &amp; gõ từ tiếng Anh</div><p class="sub">Máy đọc từ tiếng Anh, hiện nghĩa tiếng Việt, bạn gõ lại từ đó. Thứ tự từ được đảo ngẫu nhiên mỗi lần.</p><div class="row"><button class="primary" id="go">Bắt đầu / Đảo từ (Enter)</button></div></div>`;
 $('#go').onclick=start;
}

/* ---------- Menu 2: Nối từ ---------- */
function t2(){
 document.querySelectorAll('#lst').forEach(x=>x.remove());
 let order=sh(W),round=0,L,R,sl,sr,doneSet,badP;
 const per=8,rounds=Math.ceil(W.length/per);
 const init=()=>{const p=order.slice(round*per,round*per+per);L=sh(p);R=sh(p);sl=sr=null;doneSet=new Set();badP=null};
 const draw=()=>{
  const fin=doneSet.size===L.length;
  const bt=(w,side,key)=>{const d=doneSet.has(w[0]);const s=(side==='l'?sl:sr)===w[0];const b=badP&&((side==='l'&&badP[0]===w[0])||(side==='r'&&badP[1]===w[0]));
   return `<button data-s="${side}" data-k="${w[0]}" class="${d?'ok':b?'no':s?'sel':''}" ${d?'disabled':''}>${w[key]}</button>`};
  app.innerHTML=`<div class="card"><div class="top"><span>Vòng ${round+1}/${rounds}</span><span>Đã nối ${doneSet.size}/${L.length}</span></div><p class="sub">Chọn một từ tiếng Anh, rồi chọn nghĩa tương ứng.</p>
  <div class="cols"><div class="col">${L.map(w=>bt(w,'l',0)).join('')}</div><div class="col">${R.map(w=>bt(w,'r',1)).join('')}</div></div>
  <div class="fb ${fin?'ok':''}">${fin?'🎉 Hoàn thành vòng này!':''}</div>
  <div class="row"><button class="primary" id="go">${fin?(round+1<rounds?'Vòng tiếp (Enter)':'Chơi lại từ đầu (Enter)'):'Đảo lại (Enter)'}</button></div></div>`;
  $('#go').onclick=()=>{if(fin){if(round+1<rounds)round++;else{order=sh(W);round=0}}init();draw()};
  app.querySelectorAll('.col button').forEach(b=>b.onclick=()=>{
   if(b.dataset.s==='l'){sl=b.dataset.k;say(sl)}else sr=b.dataset.k;
   if(sl&&sr){if(sl===sr){doneSet.add(sl)}else{badP=[sl,sr];setTimeout(()=>{badP=null;if(tab===2)draw()},600)}sl=sr=null}
   draw()});
 };
 init();draw();
}

/* ---------- Menu 3: Trắc nghiệm ---------- */
let qdir='en';
function t3(){
 document.querySelectorAll('#lst').forEach(x=>x.remove());
 let q=sh(W),i=0,sc=0,ans=null,opts=[];
 const mk=()=>{const [e,v]=q[i];const d=qdir==='mix'?(i%2?'vi':'en'):qdir;const key=d==='en'?1:0;
  const wrong=sh(W.filter(w=>w[0]!==e)).slice(0,3);opts=sh([q[i],...wrong]).map(w=>w[key]);return{d,e,v,ans:d==='en'?v:e}};
 let cur=mk();
 const draw=()=>{
  if(i>=q.length){app.innerHTML=`<div class="card"><div class="big">Kết quả: ${sc}/${q.length}</div><div class="row"><button class="primary" id="go">Làm lại (Enter)</button></div></div>`;$('#go').onclick=t3;return}
  const chips=[['en','Anh → Việt'],['vi','Việt → Anh'],['mix','Trộn']].map(c=>`<button class="chip ${qdir===c[0]?'on':''}" data-d="${c[0]}">${c[1]}</button>`).join('');
  app.innerHTML=`<div class="card"><div class="row">${chips}</div><div class="top"><span>Câu ${i+1}/${q.length}</span><span>Đúng ${sc}</span></div>
  <div class="big">${cur.d==='en'?cur.e:cur.v}</div>${cur.d==='en'?'<div class="row"><button id="snd">🔊 Phát âm</button></div>':''}
  <div class="opts">${opts.map((o,k)=>`<button data-o="${o}" class="${ans!==null?(o===cur.ans?'ok':o===ans?'no':''):''}" ${ans!==null?'disabled':''}>${k+1}. ${o}</button>`).join('')}</div>
  <div class="row"><button class="primary" id="go">${ans===null?'Bỏ qua (Enter)':'Câu tiếp (Enter)'}</button></div></div>`;
  app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{qdir=b.dataset.d;t3()});
  if($('#snd'))$('#snd').onclick=()=>say(cur.e);
  app.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>{if(ans!==null)return;ans=b.dataset.o;if(ans===cur.ans)sc++;say(cur.e);draw()});
  $('#go').onclick=()=>{i++;ans=null;if(i<q.length)cur=mk();draw()};
 };
 draw();
}

/* ---------- Menu 4: Bài tập ---------- */
function t4(){
 document.querySelectorAll('#lst').forEach(x=>x.remove());
 const kinds=[['mix','Trộn 3 dạng'],['listen','Nghe và gõ từ'],['meaning','Đọc nghĩa, gõ từ tiếng Anh'],['scramble','Sắp xếp chữ cái bị đảo']];
 app.innerHTML=`<div class="card"><div class="big">Bài tập</div><p class="sub">Mỗi bài 12 câu, chọn ngẫu nhiên. Gõ đáp án rồi nhấn Enter.</p><div class="opts">${kinds.map(k=>`<button class="${k[0]==='mix'?'primary':''}" ${k[0]==='mix'?'id="go"':''} data-k="${k[0]}">${k[1]}</button>`).join('')}</div></div>`;
 app.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>typer({kind:b.dataset.k,title:'Bài tập: '+kinds.find(k=>k[0]===b.dataset.k)[1],n:12,back:t4}));
}
setTab(1);
</script>
</body>
</html>
