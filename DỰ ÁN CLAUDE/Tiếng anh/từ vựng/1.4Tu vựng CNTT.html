<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buổi 7 – Từ vựng CNTT</title>
<style>
:root{--bg:#f6f4ee;--sf:#fff;--tx:#1d2433;--mu:#667085;--ac:#1f4fd8;--ok:#14803c;--okb:#dff5e6;--no:#b42318;--nob:#fde4e1;--bd:#d9d6cc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171f;--sf:#1e2330;--tx:#eceff5;--mu:#98a2b3;--ac:#7da2ff;--ok:#6ee79a;--okb:#16341f;--no:#ff9a8f;--nob:#3b1a17;--bd:#343b4d}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 "Segoe UI",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font:700 26px/1.2 Georgia,"Times New Roman",serif;margin:8px 0 2px}
.sub,.pg{color:var(--mu);font-size:14px}.sub{margin:0 0 14px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
#tb{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:8px;padding:8px 12px}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:10px}
.w{font:700 20px Georgia,serif}.ipa{color:var(--mu);margin-left:6px}
.pos{display:inline-block;font-size:12px;border:1px solid var(--bd);border-radius:5px;padding:0 6px;margin-left:6px;color:var(--mu)}
.vi{font-weight:600;margin:4px 0}.ex{font-style:italic}.nt{color:var(--mu);font-size:14px;margin-top:6px;border-left:3px solid var(--ac);padding-left:8px}
.sp{padding:2px 8px;margin-left:6px}
.opt{display:block;width:100%;text-align:left;margin:6px 0}
.opt.ok,.m.done{background:var(--okb);border-color:var(--ok);color:var(--ok)}.opt.no,.m.bad{background:var(--nob);border-color:var(--no);color:var(--no)}
.q{font-size:18px;margin:4px 0 10px}
input[type=search],input[type=text]{font:inherit;width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--sf);color:var(--tx);margin-bottom:10px}
.go{background:var(--ac);color:#fff;border-color:var(--ac);margin-top:8px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.m{min-height:48px}.m.sel{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}
.big{font:700 40px Georgia,serif}
</style></head><body><main>
<h1>Buổi 7 – Từ vựng CNTT</h1>
<p class="sub">24 từ · bấm 🔊 để nghe · bài đảo liên tục · Enter = câu tiếp theo</p>
<nav id="nav"></nav>
<div id="tb"><button id="rs">🔄 Làm bài mới (đảo)</button><button id="rv"></button><button id="cl" hidden>🗑 Xóa danh sách sai</button></div>
<div id="app"></div></main>
<script>
const RAW=`ultimate|/ˈʌltɪmət/|adj|cuối cùng|The [ultimate] goal of the project is to reduce costs.|Tính từ, đứng trước danh từ: ultimate goal / aim / decision. Trạng từ: ultimately.
sole|/soʊl/|adj|duy nhất|She is the [sole] administrator of the server.|Đứng trước danh từ: sole owner / purpose / responsibility. Không đứng sau động từ to be.
merely|/ˈmɪrli/|adv|chỉ làm gì đó|This update [merely] changes the color of the button.|Trạng từ, thường đứng trước động từ chính hoặc trước phần được nhấn mạnh.
embrace|/ɪmˈbreɪs/|v|đón nhận, chấp nhận|Many companies [embrace] cloud computing.|Ngoại động từ: embrace + N (technology / change / new ideas), không cần giới từ.
emphasize|/ˈemfəsaɪz/|v|nhấn mạnh|The manual [emphasizes] data security.|emphasize + N hoặc + that-clause. Danh từ: emphasis. Anh-Anh viết emphasise.
indicate|/ˈɪndɪkeɪt/|v|chỉ ra|The error log [indicates] a network problem.|indicate + N hoặc + that-clause. Danh từ: indication.
whether|/ˈweðər/|conj|liệu rằng|Please check [whether] the file exists.|whether + mệnh đề, hay đi sau check / ask / know / decide; có thể dùng whether or not, whether to V.
semantic|/sɪˈmæntɪk/|adj|ngữ nghĩa|[Semantic] search understands the meaning of a query.|Tính từ đứng trước danh từ: semantic search / analysis / error. Danh từ: semantics.
criterion|/kraɪˈtɪriən/|n|tiêu chí|Price is the main [criterion] for selection.|Số ít: criterion; số nhiều: criteria. Hay gặp: selection criteria, meet the criteria.
redact|/rɪˈdækt/|v|chỉnh sửa|The editor will [redact] the document before it is published.|Ngoại động từ: redact + N (a document / text). Danh từ: redaction.
potential|/pəˈtenʃl/|adj, n|tiềm năng|The software has great [potential].|Danh từ không đếm được: have potential. Tính từ đứng trước danh từ: potential customers / risks.
probe|/proʊb/|v, n|thăm dò|Security teams [probe] the network for weaknesses.|Vừa là động từ vừa là danh từ. Cấu trúc: probe into sth, probe sth for sth.
dummy|/ˈdʌmi/|adj|giả|Use [dummy] data to test the system.|Đứng trước danh từ: dummy data / text / variable.
permit|/pərˈmɪt/|v|cho phép, cấp phép|The system does not [permit] guest access.|Động từ nhấn âm 2. Cấu trúc: permit + N, permit sb to V.
spoofing|/ˈspuːfɪŋ/|n|giả mạo|Email [spoofing] is a common security threat.|Danh từ không đếm được: IP / email / DNS spoofing. Động từ gốc: spoof.
amend|/əˈmend/|v|sửa đổi|The team needs to [amend] the configuration file.|Ngoại động từ: amend + N. Danh từ: amendment.
brevity|/ˈbrevəti/|n|ngắn gọn|[Brevity] is important in technical emails.|Danh từ không đếm được, khá trang trọng: for the sake of brevity. Tính từ liên quan: brief.
precise|/prɪˈsaɪs/|adj|chính xác|The sensor gives [precise] measurements.|Trạng từ: precisely. Danh từ: precision.
delve|/delv/|v|đào sâu|Let us [delve] into the source code.|Thường đi với into: delve into + N.
elaborate|/ɪˈlæbəreɪt/|v|một cách chi tiết|Could you [elaborate] on that point?|Dùng elaborate on + N để nói thêm chi tiết về điều gì. Nhấn âm 2.
contraction|/kənˈtrækʃn/|n|viết tắt|"Don't" is a [contraction] of "do not".|Danh từ đếm được. Ví dụ: don't, can't, it's.
oversee|/ˌoʊvərˈsiː/|v|quan sát|A project manager will [oversee] the migration.|oversee + N. Quá khứ: oversaw; phân từ: overseen.
compact|/kəmˈpækt/|adj|nhỏ gọn|This laptop has a [compact] design.|Tính từ nhấn âm 2: compact design / size.
suppress|/səˈpres/|v|ngăn chặn|The filter can [suppress] spam messages.|suppress + N. Danh từ: suppression.`;
const D=RAW.split("\n").map(s=>{const[w,p,t,v,e,n]=s.split("|");return{w,p,t,v,e,n}});
const $=s=>document.querySelector(s),app=$("#app");
const shuf=a=>[...a].sort(()=>Math.random()-.5);
const plain=e=>e.replace(/[\[\]]/g,"");
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
window.say=say;
const sp=t=>`<button class="sp" aria-label="Nghe" onclick="say(this.dataset.t)" data-t="${t.replace(/"/g,"&quot;")}">🔊</button>`;
let ERR={},R=false,cur=0;
try{ERR=JSON.parse(localStorage.getItem("b7err")||"{}")}catch(e){}
const sv=()=>{try{localStorage.setItem("b7err",JSON.stringify(ERR))}catch(e){}};
const nErr=()=>D.filter(d=>ERR[d.w]>0).length;
const lab=()=>$("#rv").textContent=R?"⬅ Thoát chế độ ôn câu sai":`🔁 Ôn lại câu sai (${nErr()})`;
function mark(d,ok){if(!ok)ERR[d.w]=(ERR[d.w]||0)+1;else if(R&&ERR[d.w]&&--ERR[d.w]<=0)delete ERR[d.w];sv();if(!R)lab()}
const entry=d=>`<div class="card"><span class="w">${d.w}</span><span class="ipa">${d.p}</span>${sp(d.w)}<span class="pos">${d.t}</span>${ERR[d.w]?`<span class="pos" style="color:var(--no)">sai ${ERR[d.w]} lần</span>`:""}<div class="vi">${d.v}</div><div class="ex">${d.e.replace(/\[([^\]]+)\]/,"<b>$1</b>")}${sp(plain(d.e))}</div><div class="nt">💡 Cách dùng: ${d.n}</div></div>`;
function pool(){if(!R)return shuf(D);let l=[];D.forEach(d=>{for(let k=0;k<Math.min(ERR[d.w]||0,3);k++)l.push(d)});l=shuf(l);for(let k=1;k<l.length;k++)if(l[k]===l[k-1]){const j=l.findIndex((x,m)=>m>k&&x!==l[k-1]);if(j>0)[l[k],l[j]]=[l[j],l[k]]}return l}
function opts(d){const p=x=>x.t.split(", ")[0],a=shuf(D.filter(x=>x!==d&&p(x)==p(d))),r=shuf(D.filter(x=>x!==d&&!a.includes(x)));return shuf([d,...a.concat(r).slice(0,3)])}
const tabs=[["1. Từ điển",learn],["2. Nối từ",match],["3. Trắc nghiệm",()=>ask("mc")],["4. Gõ từ",()=>ask("ty")]];
$("#nav").innerHTML=tabs.map((t,i)=>`<button data-i="${i}">${t[0]}</button>`).join("");
$("#nav").onclick=e=>{const i=e.target.dataset.i;if(i!=null){window._sh=false;go(+i)}};
$("#rs").onclick=()=>{window._sh=true;go(cur)};
$("#rv").onclick=()=>{R=!R;go(cur)};
$("#cl").onclick=()=>{ERR={};sv();R=false;go(cur)};
function go(i){cur=i;document.querySelectorAll("#nav button").forEach((b,j)=>b.classList.toggle("on",i==j));lab();$("#cl").hidden=!R;tabs[i][1]()}
document.addEventListener("keydown",e=>{if(e.repeat)return;
if(e.key=="Enter"){if(e.target.tagName=="BUTTON"&&!e.target.disabled)return;const b=$("#nx")||$("#nm");if(b){e.preventDefault();b.click()}}
else if(/^[1-4]$/.test(e.key)&&e.target.tagName!="INPUT"){const b=document.querySelectorAll("#o .opt")[+e.key-1];if(b&&!b.disabled)b.click()}});
function none(){app.innerHTML=`<div class="card"><div class="big">🎉</div><p>${R?"Hiện không còn câu sai nào cần ôn. Bạn làm rất tốt!":"Không có dữ liệu."}</p><button class="go" onclick="R=false;go(cur)">Quay lại bài thường</button></div>`}
function learn(){app.innerHTML=`<input type="search" id="s" placeholder="Tìm từ hoặc nghĩa..."><div id="l"></div>`;
const L=R?D.filter(d=>ERR[d.w]).sort((a,b)=>ERR[b.w]-ERR[a.w]):window._sh?shuf(D):D;
const r=q=>{q=q.toLowerCase();$("#l").innerHTML=L.filter(d=>(d.w+d.v).toLowerCase().includes(q)).map(entry).join("")||"<p>Không có từ nào.</p>"};
$("#s").oninput=e=>r(e.target.value);r("")}
const mkq=()=>pool().map(d=>({d,o:opts(d)}));
function ask(kind){let qs=mkq(),i=0,sc=0,tot=0;if(!qs.length)return none();
(function show(){if(i>=qs.length){qs=mkq();i=0;if(!qs.length)return none()}
const{d,o}=qs[i],M=kind=="mc";
app.innerHTML=`<div class="pg">Câu ${tot+1} · Đúng: ${sc}/${tot}${R?" · Đang ôn câu sai":""}</div><div class="card"><div class="q">`+(M?`Nghĩa của <b>${d.w}</b> ${sp(d.w)} là gì?`:`Nghe và gõ từ tiếng Anh có nghĩa: <b>${d.v}</b> ${sp(d.w)}`)+`</div>`+(M?`<div id="o">${o.map((x,k)=>`<button class="opt" data-k="${k}">${k+1}. ${x.v}</button>`).join("")}</div>`:`<p class="pg">Loại từ: ${d.t} · ${d.w.replace(/[^ ]/g,"_ ").trim()}</p><input type="text" id="in" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Đáp án"><button class="go" id="ck">Kiểm tra (Enter)</button>`)+`</div><div id="fb"></div>`;
say(d.w);
const fin=(ok,msg)=>{tot++;if(ok)sc++;mark(d,ok);$("#fb").innerHTML=`<p><b>${ok?"✅ Chính xác!":"❌ "+msg}</b></p>`+entry(d)+`<button class="go" id="nx">Câu tiếp (Enter)</button>`;say(d.w);$("#nx").onclick=()=>{i++;show()}};
if(M)$("#o").onclick=e=>{const k=e.target.dataset.k;if(k==null)return;const bs=[...document.querySelectorAll(".opt")];bs.forEach((b,j)=>{b.disabled=true;if(o[j]===d)b.classList.add("ok")});const ok=o[k]===d;if(!ok)bs[k].classList.add("no");fin(ok,"Đáp án đúng: "+d.v)};
else{$("#in").focus();const chk=()=>{const v=$("#in").value.trim().toLowerCase();if(!v)return;$("#in").disabled=true;$("#ck").remove();fin(v==d.w,"Đáp án đúng: "+d.w+" (bạn gõ: "+v+")")};$("#ck").onclick=chk;$("#in").onkeydown=e=>{if(e.key==="Enter"){e.stopPropagation();chk()}}}
})()}
function match(){let p=R?[...new Set(pool())]:shuf(D);if(R&&!p.length)return none();p=p.slice(0,6);if(p.length<6)p=p.concat(shuf(D.filter(x=>!p.includes(x))).slice(0,6-p.length));
const Rr=shuf(p),bad=new Set();let sel=null,n=0;
app.innerHTML=`<p class="pg">Chọn một từ bên trái, rồi chọn nghĩa tương ứng bên phải.${R?" (Đang ôn câu sai)":""}</p><div class="cols"><div id="a">${p.map((d,k)=>`<button class="m opt" data-k="${k}">${d.w}</button>`).join("")}</div><div id="b">${Rr.map((d,k)=>`<button class="m opt" data-k="${k}">${d.v}</button>`).join("")}</div></div><div id="fb"></div>`;
$("#a").onclick=e=>{const b=e.target.closest(".m");if(!b||b.classList.contains("done"))return;document.querySelectorAll("#a .m").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");sel=+b.dataset.k;say(p[sel].w)};
$("#b").onclick=e=>{const b=e.target.closest(".m");if(!b||b.classList.contains("done")||sel==null)return;
if(Rr[+b.dataset.k]===p[sel]){b.classList.add("done");const a=$(`#a [data-k="${sel}"]`);a.classList.remove("sel");a.classList.add("done");sel=null;
if(++n===6){p.forEach(d=>{if(!bad.has(d))mark(d,true)});$("#fb").innerHTML=`<p><b>🎉 Hoàn thành! Xem lại giải thích:</b></p>`+p.map(entry).join("")+`<button class="go" id="nm" onclick="match()">Bộ tiếp theo (Enter)</button>`}}
else{b.classList.add("bad");if(!bad.has(p[sel])){bad.add(p[sel]);mark(p[sel],false)}setTimeout(()=>b.classList.remove("bad"),600)}}}
go(0);
</script></body></html>
