<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ôn từ vựng – 26 từ</title>
<style>
:root{--bg:#f6f4ee;--sf:#fff;--tx:#1d2433;--mu:#667085;--ac:#1f4fd8;--ok:#14803c;--okb:#dff5e6;--no:#b42318;--nob:#fde4e1;--bd:#d9d6cc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171f;--sf:#1e2330;--tx:#eceff5;--mu:#98a2b3;--ac:#7da2ff;--ok:#6ee79a;--okb:#16341f;--no:#ff9a8f;--nob:#3b1a17;--bd:#343b4d}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 "Segoe UI",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font:700 26px/1.2 Georgia,"Times New Roman",serif;margin:8px 0 2px}
.sub,.pg{color:var(--mu);font-size:14px}.sub{margin:0 0 14px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:8px;padding:8px 12px}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:10px}
.w{font:700 20px Georgia,serif}.ipa{color:var(--mu);margin-left:6px}
.pos{display:inline-block;font-size:12px;border:1px solid var(--bd);border-radius:5px;padding:0 6px;margin-left:6px;color:var(--mu)}
.vi{font-weight:600;margin:4px 0}.ex{font-style:italic}.nt{color:var(--mu);font-size:14px;margin-top:6px;border-left:3px solid var(--ac);padding-left:8px}
.sp{padding:2px 8px;margin-left:6px}
.opt{display:block;width:100%;text-align:left;margin:6px 0}
.opt.ok,.m.done{background:var(--okb);border-color:var(--ok);color:var(--ok)}.opt.no,.m.bad{background:var(--nob);border-color:var(--no);color:var(--no)}
.q{font-size:18px;margin:4px 0 10px}
input[type=search]{font:inherit;width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--sf);color:var(--tx);margin-bottom:10px}
.go{background:var(--ac);color:#fff;border-color:var(--ac);margin-top:8px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.m{min-height:48px}.m.sel,.chip.sel{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}
.slot{display:inline-block;min-width:120px;border-bottom:2px dashed var(--ac);text-align:center;font-weight:700;cursor:pointer;padding:0 6px;font-style:normal}
.slot.ok{color:var(--ok);border-color:var(--ok)}.slot.no{color:var(--no);border-color:var(--no)}
.chip{margin:4px;cursor:grab}.chip.used{opacity:.35}
input[type=text]{font:inherit;width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--sf);color:var(--tx);margin-bottom:10px}
#tb{margin-bottom:12px}
.big{font:700 40px Georgia,serif}
</style></head><body><main>
<h1>Ôn từ vựng</h1>
<p class="sub">26 từ · bấm 🔊 để nghe phát âm · bài được đảo liên tục, làm bao nhiêu câu tùy bạn</p>
<nav id="nav"></nav><div id="tb"><button id="rs">🔄 Làm bài mới (đảo thứ tự)</button></div><div id="app"></div></main>
<script>
const RAW=`degrade|/dɪˈgreɪd/|v|suy giảm, làm giảm chất lượng|Poor storage can [degrade] the quality of the product.|Danh từ: degradation. Thường nói về chất lượng/hiệu suất bị giảm sút.
suitable|/ˈsuːtəbl/|adj|phù hợp|Please choose a [suitable] time for the meeting.|suitable for + N/V-ing. Trái nghĩa: unsuitable; danh từ: suitability.
holistic|/hoʊˈlɪstɪk/|adj|xem xét toàn diện, tổng thể|We take a [holistic] approach to employee wellbeing.|holistic approach = cách tiếp cận tổng thể (nhìn cả hệ thống, không xét từng phần rời rạc).
trail|/treɪl/|n|dấu vết, vết tích; đường mòn|The audit left a paper [trail].|paper trail / audit trail = dấu vết giấy tờ / kiểm toán. Động từ: theo dấu, tụt lại phía sau.
incident|/ˈɪnsɪdənt/|n|sự cố, sự việc|Please report any safety [incident] immediately.|incident report = báo cáo sự cố. Khác accident (tai nạn, gây thiệt hại).
comprehensive|/ˌkɑːmprɪˈhensɪv/|adj|toàn diện, bao quát|The package offers [comprehensive] coverage.|comprehensive insurance/review/report. Đừng nhầm comprehensible = dễ hiểu.
infer|/ɪnˈfɜːr/|v|suy ra, suy luận|Readers can [infer] the meaning from the context.|Part 7: "can be inferred" = có thể suy ra. infer (người nghe suy ra) ≠ imply (người nói ngụ ý). Danh từ: inference.
stale|/steɪl/|adj|cũ, ôi, lỗi thời|The data is [stale] and needs to be updated.|stale bread = bánh mì cũ; stale information = thông tin lỗi thời. Trái nghĩa: fresh.
multitude|/ˈmʌltɪtuːd/|n|vô số, rất nhiều|A [multitude] of factors affected the sales.|a multitude of + N số nhiều. Đồng nghĩa: a great number of.
tolerable|/ˈtɑːlərəbl/|adj|có thể chấp nhận được, chịu được|The delay was [tolerable], but not ideal.|Ở mức chấp nhận được (chưa tốt). tolerate (v), tolerance (n); trái nghĩa: intolerable.
versatility|/ˌvɜːrsəˈtɪləti/|n|tính linh hoạt, đa năng|The tool is popular for its [versatility].|Tính từ: versatile = đa năng. Dùng cho sản phẩm/người có nhiều công dụng.
accelerate|/ækˈseləreɪt/|v|thúc đẩy, tăng tốc|The new software will [accelerate] the process.|accelerate growth/the process. Danh từ: acceleration. Trái nghĩa: slow down.
granular|/ˈgrænjələr/|adj|chi tiết, tỉ mỉ|The report gives [granular] data on each store.|granular data/detail = dữ liệu chi tiết đến từng phần nhỏ. Nghĩa gốc: dạng hạt.
prompt|/prɑːmpt/|v, adj|(v) nhắc nhở, thúc đẩy; (adj) nhanh chóng|An email will [prompt] staff to submit reports.|prompt sb to V = thúc ai làm gì. Tính từ: a prompt reply/payment = hồi đáp/thanh toán nhanh. Trạng từ: promptly.
consolidate|/kənˈsɑːlɪdeɪt/|v|củng cố; hợp nhất|The firm plans to [consolidate] its two offices.|consolidate offices/debts = hợp nhất; consolidate a position = củng cố. Danh từ: consolidation.
facilitate|/fəˈsɪlɪteɪt/|v|tạo điều kiện, làm cho dễ dàng|The software will [facilitate] communication.|facilitate + N (không dùng + to V). facilitator = người điều phối; facility = cơ sở vật chất.
respectively|/rɪˈspektɪvli/|adv|tương ứng, lần lượt|Sales rose 5% and 8% in May and June, [respectively].|Đứng cuối câu khi hai danh sách khớp nhau từng cặp. Đừng nhầm respectfully = một cách kính trọng.
ubiquitous|/juːˈbɪkwətəs/|adj|phổ biến, có mặt khắp nơi|Smartphones are now [ubiquitous].|ubiquitous ≈ found everywhere. Từ trang trọng.
sufficient|/səˈfɪʃnt/|adj|đầy đủ, đủ|We have [sufficient] funds for the project.|sufficient for/to V; trái nghĩa: insufficient; trạng từ: sufficiently. Đồng nghĩa: enough.
particularly|/pərˈtɪkjələrli/|adv|đặc biệt là, cụ thể là|Prices rose, [particularly] for imported goods.|particularly ≈ especially; in particular. Tính từ: particular.
precedence|/ˈpresɪdens/|n|sự ưu tiên|Safety takes [precedence] over speed.|take precedence over = được ưu tiên hơn. Đừng nhầm precedent = tiền lệ.
interference|/ˌɪntərˈfɪrəns/|n|sự can thiệp; sự gây nhiễu|The signal is weak due to [interference].|interference with/in; động từ: interfere with/in. Còn nghĩa nhiễu sóng.
streamline|/ˈstriːmlaɪn/|v|tinh gọn, hợp lý hóa|We aim to [streamline] the hiring process.|streamline procedures/operations = đơn giản hóa quy trình. Tính từ: streamlined.
withdraw|/wɪðˈdrɔː/|v|rút (tiền, đơn); rút lui|You may [withdraw] your application at any time.|withdrew – withdrawn. Danh từ: withdrawal. withdraw money/an offer/an application.
tweak|/twiːk/|v, n|điều chỉnh nhẹ, tinh chỉnh|We need to [tweak] the design slightly.|Chỉnh sửa nhỏ (hơi thân mật). Gần nghĩa: adjust, modify.
namely|/ˈneɪmli/|adv|cụ thể là, đó là|Two items are missing, [namely] the cables and the manual.|Dùng để nêu cụ thể ngay sau ý chung, thường sau dấu phẩy. Gần nghĩa: that is, specifically.`;
const D=RAW.split("\n").map(s=>{const[w,p,t,v,e,n]=s.split("|");return{w,p,t,v,e,n}});
const $=s=>document.querySelector(s),app=$("#app");
const shuf=a=>[...a].sort(()=>Math.random()-.5);
const plain=e=>e.replace(/[\[\]]/g,""),blank=e=>e.replace(/\[[^\]]+\]/,"_____");
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
window.say=say;
const sp=t=>`<button class="sp" aria-label="Nghe" onclick="say(this.dataset.t)" data-t="${t.replace(/"/g,"&quot;")}">🔊</button>`;
const entry=d=>`<div class="card"><span class="w">${d.w}</span><span class="ipa">${d.p}</span>${sp(d.w)}<span class="pos">${d.t}</span><div class="vi">${d.v}</div><div class="ex">${d.e.replace(/\[([^\]]+)\]/,"<b>$1</b>")}${sp(plain(d.e))}</div><div class="nt">💡 ${d.n}</div></div>`;
const tabs=[["1. Từ điển",learn],["2. Nối từ",match],["3. Trắc nghiệm",quiz3],["4. Gõ từ",typing]];
let cur=0;
$("#nav").innerHTML=tabs.map((t,i)=>`<button data-i="${i}">${t[0]}</button>`).join("");
$("#nav").onclick=e=>{const i=e.target.dataset.i;if(i!=null){window._sh=false;go(+i)}};
$("#rs").onclick=()=>{window._sh=true;go(cur)};
function go(i){cur=i;document.querySelectorAll("#nav button").forEach((b,j)=>b.classList.toggle("on",i==j));tabs[i][1]()}
function learn(){app.innerHTML=`<input type="search" id="s" placeholder="Tìm từ hoặc nghĩa..."><div id="l"></div>`;
const L=window._sh?shuf(D):D;const r=q=>{q=q.toLowerCase();$("#l").innerHTML=L.filter(d=>(d.w+d.v).toLowerCase().includes(q)).map(entry).join("")||"<p>Không có kết quả.</p>"};
$("#s").oninput=e=>r(e.target.value);r("")}
function end(sc,n,again){app.innerHTML=`<div class="card"><div class="big">${sc}/${n}</div><p>${sc>=n*.8?"Rất tốt! Bạn nắm khá chắc rồi.":sc>=n*.5?"Khá ổn, xem lại các từ sai trong tab Từ điển nhé.":"Cần ôn thêm, đọc tab Từ điển rồi làm lại."}</p><button class="go" id="ag">Làm lại</button></div>`;$("#ag").onclick=again}
function opts(d){const p=x=>x.t.split(", ")[0],a=shuf(D.filter(x=>x!==d&&p(x)==p(d))),r=shuf(D.filter(x=>x!==d&&!a.includes(x)));return shuf([d,...a.concat(r).slice(0,3)])}
function end2(sc,n,again,bad){app.innerHTML=`<div class="card"><div class="big">${sc}/${n}</div><p>${sc>=n*.8?"Rất tốt! Bạn nắm khá chắc rồi.":sc>=n*.5?"Khá ổn, ôn lại các từ sai bên dưới nhé.":"Cần ôn thêm, đọc kỹ các từ bên dưới rồi làm lại."}</p><button class="go" id="ag">Làm bài mới</button></div>`+(bad.length?`<h3>Các từ cần ôn lại</h3>`+bad.map(entry).join(""):"<p>🎉 Bạn không sai từ nào!</p>");$("#ag").onclick=again}
function ask(qs,again,loop){let i=0,sc=0,tot=0,bad=[];
(function show(){if(i>=qs.length){if(loop){qs=loop();i=0}else return end2(sc,qs.length,again,bad)}
const q=qs[i],d=q.d,t=q.t,isM=["mc1","mc2","p5","ls"].includes(t);
const P={mc1:`Nghĩa của <b>${d.w}</b> ${sp(d.w)} là gì?`,mc2:`Từ nào có nghĩa: <b>${d.v}</b>?`,p5:`Chọn đáp án đúng nhất:<br><i>${blank(d.e)}</i>`,ls:`Nghe và chọn từ bạn nghe được: ${sp(d.w)}`,ty:`Gõ từ tiếng Anh có nghĩa: <b>${d.v}</b>`,ts:`Gõ từ còn thiếu:<br><i>${blank(d.e)}</i>`}[t];
const hint=t=="ty"||t=="ts"?`<p class="pg">${t=="ts"?"Nghĩa: "+d.v+" · ":""}Loại từ: ${d.t} · bắt đầu bằng “${d.w[0]}” · ${d.w.length} ký tự</p>`:"";
app.innerHTML=`<div class="pg">${loop?"Câu "+(tot+1)+" · Đúng: "+sc+"/"+tot:"Câu "+(i+1)+"/"+qs.length+" · Đúng: "+sc}</div><div class="card"><div class="q">${P}</div>${hint}`+(isM?`<div id="o">${q.o.map((x,k)=>`<button class="opt" data-k="${k}">(${"ABCD"[k]}) ${t=="mc1"?x.v:x.w}</button>`).join("")}</div>`:`<input type="text" id="in" autocomplete="off" autocapitalize="off" aria-label="Đáp án"><button class="go" id="ck">Kiểm tra</button>`)+`</div><div id="fb"></div>`;
if(t=="ls")say(d.w);
const fin=(ok,msg)=>{tot++;if(ok)sc++;else if(!bad.includes(d))bad.push(d);$("#fb").innerHTML=`<p><b>${ok?"✅ Chính xác!":"❌ "+msg}</b></p>`+entry(d)+`<button class="go" id="nx">${i+1<qs.length||loop?"Câu tiếp":"Xem kết quả"}</button>${loop?` <button id="st">Dừng &amp; xem từ cần ôn</button>`:""}`;say(t=="p5"||t=="ts"?plain(d.e):d.w);$("#nx").onclick=()=>{i++;show()};if(loop)$("#st").onclick=()=>end2(sc,tot,again,bad)};
if(isM){$("#o").onclick=e=>{const k=e.target.dataset.k;if(k==null)return;const bs=[...document.querySelectorAll(".opt")];
bs.forEach((b,j)=>{b.disabled=true;if(q.o[j]===d)b.classList.add("ok")});const ok=q.o[k]===d;if(!ok)bs[k].classList.add("no");
fin(ok,"Đáp án đúng: ("+"ABCD"[q.o.indexOf(d)]+") "+(t=="mc1"?d.v:d.w))}}
else{$("#in").focus();const chk=()=>{const v=$("#in").value.trim().toLowerCase().replace(/\s+/g," ");if(!v)return;$("#in").disabled=true;$("#ck").remove();fin(v==d.w,"Đáp án đúng: "+d.w+(v?" (bạn gõ: "+v+")":""))};
$("#ck").onclick=chk;$("#in").onkeydown=e=>{if(e.key==="Enter")chk()}}})()}
const gen=t=>()=>shuf(D).map(d=>({d,t,o:opts(d)}));
function quiz3(){ask(gen("mc1")(),quiz3,gen("mc1"))}
function typing(){ask(gen("ty")(),typing,gen("ty"))}
function mix(){const ts=shuf(["mc1","mc2","p5","ls","ty","ts","mc1","mc2","p5","ty","ts","ls"]);ask(shuf(D).slice(0,12).map((d,k)=>({d,t:ts[k],o:opts(d)})),mix)}
function match(){const ps=shuf(D).slice(0,6),R=shuf(ps);let sel=null,n=0;
app.innerHTML=`<p class="pg">Chọn một từ bên trái, rồi chọn nghĩa tương ứng bên phải.</p><div class="cols"><div id="a">${ps.map((d,k)=>`<button class="m opt" data-k="${k}">${d.w}</button>`).join("")}</div><div id="b">${R.map((d,k)=>`<button class="m opt" data-k="${k}">${d.v}</button>`).join("")}</div></div><div id="fb"></div>`;
$("#a").onclick=e=>{const b=e.target.closest(".m");if(!b||b.classList.contains("done"))return;document.querySelectorAll("#a .m").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");sel=+b.dataset.k;say(ps[sel].w)};
$("#b").onclick=e=>{const b=e.target.closest(".m");if(!b||b.classList.contains("done")||sel==null)return;
if(R[+b.dataset.k]===ps[sel]){b.classList.add("done");const a=$(`#a [data-k="${sel}"]`);a.classList.remove("sel");a.classList.add("done");sel=null;
if(++n===6)$("#fb").innerHTML=`<p><b>🎉 Hoàn thành! Xem lại giải thích:</b></p>`+ps.map(entry).join("")+`<button class="go" onclick="match()">Làm bộ mới</button>`}
else{b.classList.add("bad");setTimeout(()=>b.classList.remove("bad"),600)}}}
go(0);
</script></body></html>
