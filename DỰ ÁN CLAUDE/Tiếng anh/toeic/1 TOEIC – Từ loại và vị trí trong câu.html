<header><h1>TOEIC · Từ loại và vị trí trong câu</h1><p>Part 5 &amp; 6: nhìn vị trí chỗ trống, đoán từ loại, chọn đáp án.</p></header>

<script>
const $=s=>document.querySelector(s),app=$("#app");
const T=[
["Tổng quan 4 từ loại",`<p>Đề TOEIC hỏi từ loại bằng cách đưa <b>cùng một gốc từ</b> với 4 đuôi khác nhau. Việc cần làm: <b>xác định chỗ trống cần loại từ nào</b>, rồi chọn từ có đuôi đúng.</p>
<table><tr><th>Từ loại</th><th>Vai trò</th><th>Ví dụ</th></tr>
<tr><td>Danh từ (N)</td><td>Chỉ người, vật, việc; làm chủ ngữ, tân ngữ</td><td>decision (quyết định)</td></tr>
<tr><td>Động từ (V)</td><td>Chỉ hành động, trạng thái</td><td>decide (quyết định)</td></tr>
<tr><td>Tính từ (Adj)</td><td>Bổ nghĩa cho danh từ</td><td>decisive (quyết đoán)</td></tr>
<tr><td>Trạng từ (Adv)</td><td>Bổ nghĩa cho động từ, tính từ, trạng từ, cả câu</td><td>decisively (một cách quyết đoán)</td></tr></table>
<div class="tip"><b>Mẹo:</b> Bỏ từ cần điền ra, hỏi “chỗ này thiếu thành phần gì?”. Thiếu chủ ngữ/tân ngữ → N. Thiếu hành động → V. Thiếu từ mô tả danh từ → Adj. Thiếu từ mô tả hành động/mức độ → Adv.</div>
<p class="ex">The company made a quick decision. = Công ty đã đưa ra một quyết định nhanh chóng.</p>`],
["Danh từ (Noun)",`<h3>1. Đuôi nhận biết</h3>
<table><tr><th>Đuôi</th><th>Ví dụ</th></tr>
<tr><td>-tion, -sion</td><td>information (thông tin), decision (quyết định)</td></tr>
<tr><td>-ment</td><td>payment (khoản thanh toán), equipment (thiết bị)</td></tr>
<tr><td>-ness</td><td>business (kinh doanh), awareness (nhận thức)</td></tr>
<tr><td>-ity, -ty</td><td>quality (chất lượng), security (an ninh)</td></tr>
<tr><td>-ance, -ence</td><td>performance (hiệu suất), experience (kinh nghiệm)</td></tr>
<tr><td>-er, -or, -ist, -ant, -ee (người)</td><td>manager, director, specialist, applicant (ứng viên), employee (nhân viên)</td></tr>
<tr><td>-ship, -ism, -age, -al</td><td>relationship, tourism, damage, proposal (đề xuất)</td></tr></table>
<h3>2. Vị trí của danh từ</h3><ul>
<li><b>Sau mạo từ</b> a/an/the (có thể có tính từ ở giữa): <i>the <u>installation</u></i></li>
<li><b>Sau tính từ sở hữu</b> my, your, his, her, our, their, its và sở hữu cách ’s: <i>our <u>success</u></i></li>
<li><b>Sau tính từ</b>: <i>a successful <u>launch</u></i></li>
<li><b>Sau giới từ</b> (in, on, of, for, with, by…): <i>for <u>approval</u></i></li>
<li><b>Sau lượng từ</b> some, any, many, much, few, little, several, all: <i>several <u>applications</u></i></li>
<li><b>Làm chủ ngữ</b> (đầu câu, trước động từ) và <b>tân ngữ</b> (sau động từ thường)</li></ul>
<h3>3. Danh từ ghép (rất hay ra)</h3>
<p>Danh từ + danh từ: <i>sales figures</i> (số liệu doanh thu), <i>safety regulations</i>, <i>job application</i>, <i>customer satisfaction</i>, <i>production schedule</i>.</p>
<div class="warn"><b>Lưu ý:</b> Hai danh từ cùng gốc khác nghĩa: <i>applicant</i> (người nộp đơn) ≠ <i>application</i> (đơn). Danh từ đếm được số ít phải có mạo từ hoặc từ hạn định đi trước.</div>`],
["Động từ (Verb)",`<h3>1. Đuôi nhận biết</h3>
<table><tr><th>Đuôi</th><th>Ví dụ</th></tr>
<tr><td>-ize / -ise</td><td>organize (tổ chức), finalize (hoàn tất)</td></tr>
<tr><td>-ify</td><td>verify (xác minh), modify (chỉnh sửa)</td></tr>
<tr><td>-ate</td><td>operate (vận hành), indicate (cho thấy)</td></tr>
<tr><td>-en</td><td>widen (mở rộng), strengthen (tăng cường)</td></tr>
<tr><td>en-, be-, re-</td><td>enable, ensure, rebuild</td></tr></table>
<h3>2. Vị trí của động từ</h3><ul>
<li><b>Sau chủ ngữ</b>: <i>The report <u>shows</u>…</i> (chia theo chủ ngữ và thì)</li>
<li><b>Sau trạng từ tần suất</b> always, usually, often, never: <i>She always <u>submits</u>…</i></li>
<li><b>Sau to</b> (to V): <i>decided to <u>extend</u></i></li>
<li><b>Sau modal</b> will, can, must, should, may + V nguyên mẫu</li>
<li><b>Sau Please</b> (câu mệnh lệnh): <i>Please <u>review</u>…</i></li>
<li><b>Sau have/has/had</b> + V3; <b>sau be</b> + V-ing/V3 (tiếp diễn, bị động)</li></ul>
<div class="tip"><b>Mẹo:</b> Câu chưa có động từ chính (chủ ngữ + … + ?) thì chỗ trống thường là động từ đã chia. Chú ý chủ ngữ số ít/nhiều và thì.</div>`],
["Tính từ (Adjective)",`<h3>1. Đuôi nhận biết</h3>
<table><tr><th>Đuôi</th><th>Ví dụ</th></tr>
<tr><td>-ful, -less</td><td>helpful (hữu ích), useless (vô dụng)</td></tr>
<tr><td>-ous, -ious</td><td>numerous (nhiều), various (đa dạng)</td></tr>
<tr><td>-ive</td><td>effective (hiệu quả), competitive (cạnh tranh)</td></tr>
<tr><td>-able, -ible</td><td>available (có sẵn), responsible (chịu trách nhiệm)</td></tr>
<tr><td>-al, -ic, -ical</td><td>financial (tài chính), economic (thuộc kinh tế)</td></tr>
<tr><td>-ent, -ant</td><td>efficient (hiệu quả), important (quan trọng)</td></tr>
<tr><td>-ed, -ing, -y</td><td>qualified (đủ trình độ), promising, busy</td></tr></table>
<h3>2. Vị trí của tính từ</h3><ul>
<li><b>Trước danh từ</b>: <i>a <u>reliable</u> supplier</i></li>
<li><b>Sau be, become, seem, remain, look, feel…</b>: <i>The price is <u>reasonable</u>.</i></li>
<li><b>Sau trạng từ chỉ mức độ</b> very, so, too, quite, extremely: <i>very <u>impressive</u></i></li>
<li><b>Sau make/keep/find/consider + tân ngữ</b>: <i>keep the files <u>confidential</u></i></li>
<li><b>Trong so sánh</b>: more/most + adj, adj-er</li></ul>
<div class="warn"><b>Phân biệt:</b> economy (n, nền kinh tế) / economic (adj, thuộc kinh tế) / economical (adj, tiết kiệm). V-ed: cảm nhận của người (<i>interested</i>); V-ing: tính chất của vật (<i>interesting</i>).</div>`],
["Trạng từ (Adverb)",`<h3>1. Nhận biết</h3>
<p>Thường là <b>tính từ + -ly</b>: quickly (nhanh), carefully (cẩn thận), significantly (đáng kể). Ngoại lệ không đổi dạng: fast, hard, late, early, well.</p>
<div class="warn"><b>Bẫy:</b> hard (chăm chỉ) ≠ hardly (hầu như không); late (muộn) ≠ lately (gần đây); high (cao) ≠ highly (rất, đánh giá cao). Từ tận cùng -ly nhưng là tính từ: friendly, costly, likely, timely.</div>
<h3>2. Vị trí của trạng từ</h3><ul>
<li><b>Trước tính từ</b>: <i>extremely <u>useful</u></i></li>
<li><b>Giữa trợ động từ và động từ chính</b>: <i>has <u>steadily</u> increased</i>; <i>will <u>officially</u> announce</i></li>
<li><b>Sau động từ thường hoặc sau tân ngữ</b>: <i>completed <u>successfully</u></i></li>
<li><b>Giữa be và V3/V-ing</b>: <i>was <u>carefully</u> reviewed</i></li>
<li><b>Đầu câu</b> (trước dấu phẩy) bổ nghĩa cả câu: <i><u>Unfortunately</u>, the flight…</i></li>
<li><b>Trước trạng từ khác</b>, và trong so sánh: <i>considerably better</i></li></ul>
<div class="tip"><b>Mẹo:</b> Nếu bỏ chỗ trống mà câu vẫn đủ nghĩa và đủ ngữ pháp thì đa số là trạng từ.</div>`],
["Mẹo làm bài TOEIC",`<ul>
<li><b>Bước 1:</b> Đọc các đáp án, thấy cùng gốc, khác đuôi → bài từ loại.</li>
<li><b>Bước 2:</b> Nhìn từ đứng ngay trước và sau chỗ trống để xác định vị trí.</li>
<li><b>Bước 3:</b> Chọn đúng từ loại, rồi mới xét nghĩa (nếu còn 2 đáp án cùng từ loại).</li>
<li>Chỗ trống sau <b>a/an/the</b> mà không có danh từ phía sau → danh từ. Có danh từ phía sau → tính từ.</li>
<li>Chỗ trống giữa <b>to</b> và tân ngữ → động từ nguyên mẫu.</li>
<li>Sau giới từ nếu là động từ phải ở dạng V-ing: <i>by <u>reducing</u> costs</i>.</li></ul>
<div class="tip"><b>Công thức nhanh:</b> N: sau mạo từ/sở hữu/giới từ. V: sau chủ ngữ/to/modal. Adj: trước N hoặc sau be. Adv: trước adj hoặc giữa trợ động từ và V.</div>
<div class="warn"><b>Sai lầm phổ biến:</b> chọn từ vì thấy quen nghĩa mà không nhìn vị trí; quên chia động từ theo chủ ngữ số ít/số nhiều; nhầm hard/hardly, late/lately.</div>`]];
const QZ=[["Đuôi -tion thường là từ loại nào?",["Danh từ","Động từ","Tính từ","Trạng từ"],0,"Information, decision… đều là danh từ."],
["Sau tính từ sở hữu (your, our…) cần điền loại từ nào?",["Động từ","Danh từ","Trạng từ","Giới từ"],1,"Sau your/our/his/her… là danh từ (có thể có tính từ ở giữa)."],
["Sau “very” cần loại từ nào?",["Danh từ","Động từ","Tính từ","Mạo từ"],2,"very + adj/adv. Ví dụ: very impressive."],
["Trạng từ thường đứng ở đâu trong “has ___ increased”?",["Giữa have và V3","Sau mạo từ","Sau giới từ","Trước danh từ"],0,"Trạng từ nằm giữa trợ động từ và động từ chính."],
["Đuôi -ize, -ify, -en thường là từ loại nào?",["Danh từ","Tính từ","Trạng từ","Động từ"],3,"organize, verify, widen đều là động từ."],
["“keep/find/make + tân ngữ + ___”: điền loại từ nào?",["Tính từ","Danh từ","Trạng từ","Động từ chia"],0,"Ví dụ: keep the files confidential."],
["“hardly” có nghĩa là gì?",["Chăm chỉ","Hầu như không","Rất khó","Nhanh chóng"],1,"hard = chăm chỉ; hardly = hầu như không."],
["Sau “to” trong “decided to ___” dùng dạng nào?",["V-ing","V3","V nguyên mẫu","Danh từ"],2,"to + V nguyên mẫu (khi to là một phần của động từ nguyên mẫu)."]];
const MT=[["-tion",0],["-ment",0],["-ness",0],["-ize",1],["-ify",1],["-en (widen)",1],["-ful",2],["-ous",2],["-able",2],["-ly",3],["Sau the/a/your",0],["Sau to / will / can",1],["Trước danh từ",2],["Giữa have và V3",3]];
const CAT=["Danh từ","Động từ","Tính từ","Trạng từ"];
const EX=[["Bài 1: Danh từ",[
["The ___ of the new software will begin next week.","install|installation|installing|installed",1,"Việc cài đặt phần mềm mới sẽ bắt đầu vào tuần sau.","Sau “The” và trước “of” cần danh từ làm chủ ngữ → installation."],
["Please submit your ___ before the deadline.","apply|applicant|application|applicable",2,"Vui lòng nộp đơn của bạn trước hạn chót.","Sau “your” cần danh từ. Application = đơn; applicant = người nộp đơn (không hợp nghĩa)."],
["Ms. Lee is a successful ___ in the fashion industry.","design|designer|designing|designed",1,"Cô Lee là một nhà thiết kế thành công trong ngành thời trang.","Sau a + tính từ cần danh từ chỉ người → designer."],
["The company’s ___ has increased by 20% this year.","profitable|profit|profitably|profiting",1,"Lợi nhuận của công ty đã tăng 20% trong năm nay.","Sau sở hữu cách ’s cần danh từ làm chủ ngữ → profit."],
["We appreciate your ___ with this project.","cooperate|cooperative|cooperation|cooperatively",2,"Chúng tôi trân trọng sự hợp tác của bạn trong dự án này.","Sau “your” cần danh từ; đuôi -tion là danh từ."],
["Employees must show their ___ at the entrance.","identify|identification|identifiable|identified",1,"Nhân viên phải xuất trình giấy tờ nhận dạng ở lối vào.","Sau tính từ sở hữu “their” cần danh từ → identification."],
["The manager gave detailed ___ about the new policy.","explain|explanations|explanatory|explanatorily",1,"Quản lý đã đưa ra những lời giải thích chi tiết về chính sách mới.","Sau tính từ “detailed” cần danh từ; số nhiều nên không cần mạo từ."],
["There is a growing ___ for electric vehicles.","demand|demanding|demanded|demandingly",0,"Nhu cầu về xe điện đang ngày càng tăng.","a + adj (growing) + danh từ → demand (demand for = nhu cầu về)."],
["Thanks to his ___, the team won the contract.","persuade|persuasive|persuasion|persuasively",2,"Nhờ khả năng thuyết phục của anh ấy, nhóm đã giành được hợp đồng.","Sau “his” cần danh từ → persuasion."],
["The ___ of the building was completed in May.","construct|construction|constructive|constructively",1,"Việc xây dựng tòa nhà đã hoàn thành vào tháng Năm.","Sau “The” cần danh từ làm chủ ngữ → construction."]]],
["Bài 2: Động từ",[

["The new system will ___ our efficiency.","improvement|improve|improved|improving",1,"Hệ thống mới sẽ cải thiện hiệu quả của chúng ta.","Sau modal “will” dùng V nguyên mẫu."],
["She always ___ her reports on time.","submit|submits|submitting|submitted",1,"Cô ấy luôn nộp báo cáo đúng hạn.","Chủ ngữ số ít, hiện tại đơn, đứng sau trạng từ tần suất → submits."],
["The board decided to ___ the contract.","extension|extend|extensive|extensively",1,"Hội đồng quản trị quyết định gia hạn hợp đồng.","decided to + V nguyên mẫu → extend."],

function tabs(list,v,f){return`<div class="tabs">${list.map((n,i)=>`<button class="${i==v?"on":""}" onclick="${f}=${i};render()">${n}</button>`).join("")}</div>`}
function qblock(q,i,pre){const[t,o,a,vi,ex]=q;return`<div class="card q" id="${pre}${i}"><b>${i+1}. ${t}</b>${o.map((x,k)=>`<button class="opt" onclick="pick('${pre}${i}',${k},${a})">${"ABCD"[k]}. ${x}</button>`).join("")}<div class="fb">${vi?`<b>Dịch:</b> ${vi}<br>`:""}<b>${vi?"Giải thích":"Đáp án"}:</b> ${ex}</div></div>`}
function pick(id,k,a){const el=document.getElementById(id);if(el.classList.contains("done"))return;el.classList.add("done");const bs=el.querySelectorAll(".opt");bs[a].classList.add("ok");if(k!=a)bs[k].classList.add("no");sc[id]=k==a;const ks=Object.keys(sc);$("#sc").textContent="Đúng "+ks.filter(x=>sc[x]).length+"/"+ks.length+" câu đã làm"}
const pool=i=>i<4?WD.filter(w=>w[1]==i).concat(sh(WD.filter(w=>w[1]!=i)).slice(0,6)):WD;
const redo=`<button class="btn" onclick="render()">Làm lại</button>`;
function render(){[...nav.children].forEach((b,i)=>b.classList.toggle("on",i==cur));sc={};
if(cur==0)app.innerHTML=tabs(T.map(t=>t[0]),sub,"sub")+`<div class="card"><h2>${T[sub][0]}</h2>${T[sub][1]}</div>`;
else if(cur==1){app.innerHTML=tabs(LS,sub,"sub")+tabs(["Quiz nhận biết đuôi","Nối từ loại"],md,"md");md?match():quiz()}
else{app.innerHTML=tabs(EX.map(e=>e[0]),sub,"sub");exer()}
scrollTo(0,0)}
function quiz(){const it=sh(pool(sub)).slice(0,8);app.innerHTML+=`<div class="score" id="sc">Chọn đáp án để xem kết quả ngay</div>`+it.map((w,i)=>qblock([`Từ “${w[0]}” (${w[3]}) thuộc từ loại nào?`,CAT,w[1],"",`Đuôi <b>${w[2]}</b> → ${CAT[w[1]]}.`],i,"mq")).join("")+redo}
function exer(){const bank=EX[sub][1],ch=sh(bank).slice(0,10);app.innerHTML+=`<div class="score" id="sc">Ngân hàng ${bank.length} câu, chọn ngẫu nhiên 10 câu</div>`+ch.map((q,i)=>{const o=q[1].split("|"),s=sh(o);return qblock([q[0],s,s.indexOf(o[q[2]]),q[3],q[4]],i,"ex"+sub+"_")}).join("")+`<button class="btn" onclick="render()">Tạo bài mới (đảo câu)</button>`}
function match(){const M=sh(pool(sub)).slice(0,10);let sel=null,left=M.length;app.innerHTML+=`<div class="card"><p>Bấm một từ bên trái, rồi bấm từ loại tương ứng bên phải.</p><div class="grid"><div>${M.map((m,i)=>`<button class="it" data-i="${i}">${m[0]}</button>`).join("")}</div><div>${CAT.map((c,i)=>`<button class="cat it" data-c="${i}">${c}</button>`).join("")}</div></div><div class="score" id="ms"></div>${redo}</div>`;
app.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{app.querySelectorAll("[data-i]").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");sel=+b.dataset.i});
app.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{if(sel==null)return;const it=app.querySelector(`[data-i="${sel}"]`);if(M[sel][1]==+b.dataset.c){it.classList.remove("sel");it.classList.add("ok");it.textContent+=" → "+CAT[M[sel][1]]+" ("+M[sel][2]+")";sel=null;if(!--left)$("#ms").textContent="Hoàn thành, bạn nối đúng hết."}else{b.classList.add("no");setTimeout(()=>b.classList.remove("no"),500)}})}
render();
</script></body></html>
