calc:["Số điện tiêu thụ = chỉ số mới − chỉ số cũ (kWh).","Tiền điện theo bậc thang (xem bảng). Ví dụ 120 kWh: 50×1.800 + 50×2.200 + 20×3.000.","VAT = 10% tiền điện. Tổng cộng = tiền điện + VAT.","Mức tiêu thụ: ≤ 50 kWh là “Tiet kiem”; ≤ 150 kWh là “Binh thuong”; còn lại là “Cao”."],
tb:[["Bậc","Số kWh","Đơn giá (VND/kWh)"],["1","0 – 50","1.800"],["2","51 – 100","2.200"],["3","từ 101","3.000"]],
out:"Khách hang: Nguyen Van A\nChi so cu: 100  Chi so moi: 220\nTieu thu: 120 kWh (Binh thuong)\nTien dien: 282000\nVAT: 28200\nTong cong: 310200",
st:["Khai báo Scanner, đọc tên bằng nextLine().","Dùng do...while để nhập 2 chỉ số, lặp lại nếu moi < cu.","Tính kWh, rồi chia 3 trường hợp bằng if để tính tiền.","Tính VAT, tổng, xếp mức tiêu thụ, in kết quả.","Test: 0 kWh, 50, 51, 100, 101, 150, 151 và trường hợp nhập sai."],
tip:"Lỗi hay gặp: gọi nextInt() rồi nextLine() thì dòng tên bị trôi. Sau nextInt() thêm sc.nextLine(); để “nuốt” phím Enter thừa. Nên nhập TÊN trước (như đề) để tránh lỗi này.",
code:`import java.util.Scanner;
public class TienDien {
  public static void main(String[] args) {
    Scanner sc = new Scanner(System.in);
    System.out.print("Ten khach hang: ");
    String ten = sc.nextLine();
    int cu, moi;
    do {
      System.out.print("Chi so cu: ");  cu = sc.nextInt();
      System.out.print("Chi so moi: "); moi = sc.nextInt();
      if (moi < cu) System.out.println("Loi: chi so moi nho hon chi so cu!");
    } while (moi < cu);
    int kwh = moi - cu;
    double tien;
    if (kwh <= 50) tien = kwh * 1800;
    else if (kwh <= 100) tien = 50 * 1800 + (kwh - 50) * 2200;
    else tien = 50 * 1800 + 50 * 2200 + (kwh - 100) * 3000;
    double vat = tien * 0.1;
    String muc = kwh <= 50 ? "Tiet kiem" : (kwh <= 150 ? "Binh thuong" : "Cao");
    System.out.println("Tieu thu: " + kwh + " kWh (" + muc + ")");
    System.out.println("Tien dien: " + tien);
    System.out.println("VAT: " + vat);
    System.out.println("Tong cong: " + (tien + vat));
  }
}`},

let cur=0,done={};
try{done=JSON.parse(localStorage.getItem("javaDone")||"{}")||{}}catch(e){}
const $=id=>document.getElementById(id);
function save(){try{localStorage.setItem("javaDone",JSON.stringify(done))}catch(e){}}
function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function prog(){const n=S.filter((_,i)=>done[i]).length;$("pb").style.width=n/S.length*100+"%";$("pt").textContent="Đã xong "+n+"/"+S.length+" buổi";}
function tabs(){$("tabs").innerHTML=S.map((s,i)=>`<button class="tab ${i==cur?"on":""} ${done[i]?"done":""}" onclick="go(${i})">Buổi ${i+1}<small>${s.lv}</small></button>`).join("")}
function li(a){return "<ul>"+a.map(x=>"<li>"+x+"</li>").join("")+"</ul>"}
function show(){const s=S[cur];
let t=s.tb?`<div class="tw"><table>${s.tb.map((r,i)=>"<tr>"+r.map(c=>i?`<td>${c}</td>`:`<th>${c}</th>`).join("")+"</tr>").join("")}</table></div>`:"";
$("main").innerHTML=`
<div class="card"><span class="badge">Buổi ${cur+1}</span><span class="badge">${s.lv}</span><h2 style="margin:10px 0 2px;font-size:20px">${s.p}</h2>
<div class="sub" style="margin:0">Chủ đề: ${s.t}</div><p><b>Mục tiêu:</b> ${s.goal}</p></div>
<div class="card"><h3>📘 1. Học lý thuyết trước (10–15 phút)</h3><dl>${s.th.map(x=>`<dt>${x[0]}</dt><dd>${x[1]}</dd>`).join("")}</dl></div>
<div class="card"><h3>📝 2. Đề dự án</h3>
<p><b>Yêu cầu:</b> ${s.req}</p>
<p><b>1. Nhập:</b></p>${li(s.inp)}
<p><b>2. Tính / xử lý:</b></p>${li(s.calc)}${t}
<p><b>Ví dụ chạy mẫu:</b></p><pre><code>${esc(s.out)}</code></pre></div>
<div class="card"><h3>🛠 3. Các bước làm gợi ý</h3><ol>${s.st.map(x=>"<li>"+x+"</li>").join("")}</ol>
<div class="tip">💡 ${s.tip}</div>
<details><summary>Xem code gợi ý (chỉ xem sau khi tự thử ít nhất 20 phút)</summary><pre><code>${esc(s.code)}</code></pre></details></div>
<div class="chk"><input type="checkbox" id="ck" ${done[cur]?"checked":""} onchange="done[${cur}]=this.checked;save();prog();tabs()"><label for="ck">Mình đã tự chạy được chương trình và qua hết các test</label></div>
<div class="nav"><button class="b" onclick="go(${cur-1})" ${cur?"":"disabled"}>← Buổi trước</button><button class="b" onclick="go(${cur+1})" ${cur<S.length-1?"":"disabled"}>Buổi sau →</button></div>`}
function go(i){if(i<0||i>=S.length)return;cur=i;tabs();show();window.scrollTo(0,0)}
prog();tabs();show();
</script>
</body>
